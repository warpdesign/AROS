name: Publish CD32 compatibility list

on:
  push:
    branches: [cd32-compatibility]
    paths:
      - arch/m68k-amiga/CD32-COMPATIBILITY.md
      - arch/m68k-amiga/cd32-compatibility-list/**
      - .github/workflows/cd32-compat-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Deploy only the compatibility branch in the fork.
    if: github.repository == 'warpdesign/AROS' && github.ref == 'refs/heads/cd32-compatibility'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up page tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check compatibility page
        run: node --test arch/m68k-amiga/cd32-compatibility-list/tests/site.test.cjs

      - name: Check desktop and mobile layout
        run: node arch/m68k-amiga/cd32-compatibility-list/tests/browser-layout.cjs

      # Keep the page and the list side by side so its relative fetch works.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp arch/m68k-amiga/CD32-COMPATIBILITY.md _site/
          cp -R arch/m68k-amiga/cd32-compatibility-list _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
